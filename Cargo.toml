[package]
version = "0.1.1"
name = "cebelca-cli"
authors = ["Oto Brglez <otobrglez@gmail.com>"]
edition = "2024"
description = "(Unofficial) Čebelca BIZ CLI — invoicing and accounting from the terminal"
repository = "https://github.com/otobrglez/cebelca-cli"
readme = "README.md"

[[bin]]
name = "ceb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
env_logger = "0.11.11"
graphql_client = { version = "0.16.0", features = ["reqwest", "reqwest-rustls"] }
log = "0.4.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
